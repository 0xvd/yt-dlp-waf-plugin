[project]
name = "yt-dlp-waf-solver"
description = "A yt-dlp plugin to solve awf waf challenges"
authors = [{name = "0xvd", email = "0xvd12@gmail.com"}]
version = "2024.04.29"
readme = "README.md"
requires-python = ">=3.8"
keywords = [
    "yt-dlp",
    "yt-dlp-plugins",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["yt_dlp_plugins.*"]
namespaces = true